CONFIG_ZMK_POINTING=y

CONFIG_I2C=y
CONFIG_INPUT_TPS43=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Enter deep sleep after 15 minutes of inactivity.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ZMK activity-idle timeout (30 seconds), separate from the trackpad's sensing modes.
# The right overlay keeps the trackpad scanning during ZMK idle for fast first-touch response.
CONFIG_ZMK_IDLE_TIMEOUT=30000

CONFIG_INPUT_THREAD_STACK_SIZE=2048
